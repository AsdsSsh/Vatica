services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: vatica-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-vatica}
      POSTGRES_USER: ${POSTGRES_USERNAME:-vatica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vatica-local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - vatica-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  vatica-postgres-data:
