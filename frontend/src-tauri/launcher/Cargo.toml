[package]
name = "vatica-backend-launcher"
version = "0.1.0"
edition = "2021"
description = "Vatica 后端 sidecar 启动器：以打包后的 jlink JRE 拉起 Spring Boot jar"

[[bin]]
name = "vatica-backend"
path = "src/main.rs"

# 父进程看门狗（迭代 8）：Toolhelp 进程快照轮询桌面壳存活
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["tlhelp32", "handleapi"] }
