# ═══ 第三方模拟天气 MCP 服务（迭代 4，独立进程 8081）═══
# 启动：mvn spring-boot:run -Dspring-boot.run.main-class=com.example.vatica.weather.WeatherMcpApplication -Dspring-boot.run.profiles=weather
server:
  port: 8081

spring:
  application:
    name: vatica-weather-mcp
  # 迭代 5：天气服务是纯 MCP 工具进程，不需要数据库——排除 JDBC/JPA 自动配置
  # （否则会继承主 yml 的 MySQL 数据源并在启动时要求数据库凭据）
  # 注意：Boot 4.1 已改包名（jdbc/hibernate/data.jpa 分包），与 Boot 3 的旧类名不同
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration
  ai:
    mcp:
      # 天气服务是纯 MCP Server：禁用客户端（不继承主 yml 的 weather 连接，避免自连失败）
      client:
        enabled: false
      server:
        name: vatica-weather-service
        version: 1.0.0
        # 显式声明 STREAMABLE（同主应用，缺省会退回 SSE、/mcp 返回 404）
        protocol: STREAMABLE
        instructions: 第三方模拟天气服务：提供指定城市当天天气与 1-7 日预报。数据为确定性模拟值（演示用，非真实天气）。
