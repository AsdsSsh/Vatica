spring:
  application:
    name: office-agent
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7
    # 备用模型切换（代码零改动，改这里即可）：
    #   通义千问: base-url=https://dashscope.aliyuncs.com/compatible-mode/v1, model=qwen-plus, api-key 换成 QWEN_API_KEY

server:
  port: 8080
