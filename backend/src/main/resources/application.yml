spring:
  application:
    name: vatica
  # ═══ 迭代 5：MySQL 持久化（任务 + 会话）═══
  # 凭据走环境变量（仿 DEEPSEEK_API_KEY 模式），默认指向本机 MySQL：
  #   setx MYSQL_USERNAME vatica / setx MYSQL_PASSWORD <密码>
  # 云 MySQL（演示环境）：setx MYSQL_HOST REDACTED_DB_HOST + setx MYSQL_PASSWORD <密码>
  # 注意：云库凭据不要写进 yml/提交 git（仓库公开）
  # 测试环境用 H2（MySQL 兼容模式，见测试类 properties）
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:vatica}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:vatica}
    password: ${MYSQL_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update      # 开发期自动建表；生产应改 validate + 迁移脚本
    open-in-view: false
  ai:
    openai:
      # 迭代 13：模型 Key 不再读环境变量——平台/用户凭据走加密凭据库与请求级透传
      api-key: ""
      base-url: https://api.deepseek.com
      chat:
        model: deepseek-v4-flash
        # 注意：v4 系列默认开启思考模式，思考模式下 temperature 等采样参数被服务端忽略（不报错）
        # 关闭思考需传 {"thinking": {"type": "disabled"}}；工具调用时须回传 reasoning_content（见官方思考模式文档）
        temperature: 0.7
    # ═══ 迭代 4：MCP 协议 ═══
    # 服务端：本应用作为 MCP Server，把全部本地工具以 Streamable HTTP 暴露在 POST /mcp
    # （2.0 中 protocol 默认即 STREAMABLE；工具经 ToolCallback 转换器自动暴露，无需逐一声明）
    mcp:
      server:
        name: vatica-mcp-server
        version: 1.0.0
        # 必须显式声明：STREAMABLE 自动配置条件是显式匹配（matchIfMissing=false），
        # 不写会退回 SSE 传输、POST /mcp 收 JSON-RPC 返回 404（迭代 4 实测）
        protocol: STREAMABLE
        instructions: Vatica 个人助理工具集：文件读写、文档生成（Word/Excel）、日历、待办、邮件。
      # 客户端：高德地图官方 MCP（迭代 4.5，替代已删除的模拟天气服务）
      # 实测要点（2026-08-15 curl 握手核实）：
      #   1) 参数名是 ?key=（官方文档写 api_key，但网关只认 key，api_key 会返回 INVALID_USER_KEY）
      #   2) 网关只接受 POST（GET 返回 405），SDK 客户端自动降级为请求-响应模式（onErrorComplete 实测路径）
      #   3) 服务端无 Mcp-Session-Id（无状态按请求校验），SDK 按无会话模式工作
      # 凭据不再走环境变量：AMAP key 从外部服务设置页加密配置（保存后重启生效）
      client:
        initialized: false
        streamable-http:
          connections:
            amap:
              url: https://mcp.amap.com
              endpoint: /mcp
    # ═══ 多模型切换（只改配置，不动代码）═══
    # DeepSeek 与通义千问都兼容 OpenAI 协议：换模型 = 换 base-url + model + api-key
    # 旧别名 deepseek-chat/deepseek-reasoner 已于 2026-07-24 弃用，改用 v4 系列 ID：deepseek-v4-flash / deepseek-v4-pro
    #
    # 切到通义千问时，把上方 openai 块的 api-key/base-url/chat 整块替换为：
    #   api-key: ${QWEN_API_KEY:}
    #   base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    #   chat:
    #     model: qwen-plus
    #     temperature: 0.7
    #
    # 注意：Spring AI 2.0 已弃用 chat.options.* 写法（官方元数据 deprecated 标记），
    # 直接平铺到 chat.* 层（model / temperature 等）。勿再写 options 嵌套块。
    # 第 7 周前端"模型选择器"(W7-5) 上线后，升级为运行时双模型 Bean 方案

# ===== 工具层配置（迭代 2；迭代 11 改为 Codex workspace 语义）=====
# workspace-dir = 默认工作区根（相对路径以进程工作目录为基准，即 Codex 的启动目录）
# 内部状态（日历/待办/模型配置/H2）在 vatica.app.state-dir，取代旧 ./data
vatica:
  app:
    state-dir: ./.vatica
  # 迭代 14：云端文件固定落在 {base-dir}/{orgId}/{userId}/，客户端只传相对路径
  workspace:
    base-dir: ./workspace
  # ===== 鉴权（迭代 13 I13-2）=====
  # enabled=false 为过渡期开关：前端登录页上线后云端部署置 true；
  # token-ttl 为 JWT 有效期，签名密钥由 .vatica/master.key 派生
  auth:
    enabled: false
    token-ttl: 12h
  tool:
    # 迭代 2.5：单次请求工具调用次数上限（ToolCallLimitProvider 护栏），防模型死循环烧 token
    max-calls-per-request: 20
    file:
      workspace-dir: .
      max-read-size-bytes: 524288   # 512KB，防止大文件烧 token
  # ===== 邮件配置（迭代 3.5；迭代 13 改为外部服务设置页加密配置，保存后重启生效）=====
  # 未配置时 mail_query / mail_send 返回"未配置"指引，不影响其他工具
  mail:
    imap-host: ""
    imap-port: 993    # 993=IMAP SSL；其他端口按明文处理（GreenMail 测试用）
    smtp-host: ""
    smtp-port: 465    # 465=SMTP SSL；587=STARTTLS；其他端口按明文处理
    username: ""
    password: ""

# ===== 对话层配置（迭代 2.5）=====
# SSE 超时保护：上游挂起/客户端假死时主动收尾，避免连接无限期挂起（默认 5 分钟）
# 会话短期记忆（内存版）：单会话消息数滑动窗口 + 会话总数 LRU 淘汰；持久化迭代 5 已落地（JPA）
  chat:
    sse:
      timeout: 5m
    memory:
      max-messages: 20
      max-sessions: 64
      max-chars: 16000     # 单会话历史字符数上限（token 的工程近似）
  # ===== 质量评测（迭代 5.5，LLM-as-Judge）=====
  judge:
    pass-threshold: 70      # Judge 评分 >= 阈值判 PASS 交付；低分自动返工
    max-auto-rework: 2      # 低分自动返工上限（防死循环）；超限 NEEDS_REVISION 交人工
  # ===== 模型选择器（迭代 7 I7-5）=====
  # 主模型 DeepSeek 走 spring.ai.openai.*；备用模型通义千问（OpenAI 兼容）：
  #   setx QWEN_API_KEY <你的通义Key> 后重启，前端模型选择器即可切换
  model:
    qwen:
      # 迭代 13：不再读环境变量；key 走凭据库/请求级透传
      api-key: ""
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      model: qwen-plus
      temperature: 0.7

# 调试工具调用轮次（需要时取消注释，默认关闭）
# logging:
#   level:
#     org.springframework.ai.chat.client.advisor: DEBUG

# ===== OpenAPI 契约（迭代 9 I9-2，springdoc）=====
# /v3/api-docs = 前后端契约单一事实来源；/swagger-ui.html = 开发期可视化契约
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8080
