spring:
  application:
    name: vatica
  # ═══ 迭代 19A：PostgreSQL 持久化（任务 + 会话 + pgvector 基础）═══
  # 凭据走环境变量（仿 DEEPSEEK_API_KEY 模式），默认指向本机 PostgreSQL：
  #   setx POSTGRES_USERNAME vatica / setx POSTGRES_PASSWORD <密码>
  # 云 PostgreSQL：setx POSTGRES_HOST <主机> + setx POSTGRES_PASSWORD <密码>
  # 注意：云库凭据不要写进 yml/提交 git（仓库公开）
  # 测试环境用 H2（兼容模式，见测试类 properties）
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DATABASE:vatica}
    username: ${POSTGRES_USERNAME:vatica}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update      # 开发期自动建表；生产应改 validate + 迁移脚本
    open-in-view: false

# ===== 工具层配置（迭代 2；迭代 11 改为 Codex workspace 语义）=====
# workspace-dir = 默认工作区根（相对路径以进程工作目录为基准，即 Codex 的启动目录）
# 内部状态（日历/待办/模型配置/H2 打包库）在 vatica.app.state-dir，取代旧 ./data
vatica:
  app:
    state-dir: ./.vatica
  # 迭代 21D：Agent Span 明细默认保留 30 天；启动时 best-effort 清理过期记录。
  observability:
    retention: ${VATICA_OBSERVABILITY_RETENTION:30d}
  # 迭代 30A：AgentScope 原生模型窗口 + Vatica 总预算账本。
  # 输出预留和安全余量不属于历史消息，避免工具 Schema 或回答空间挤穿窗口。
  agent:
    context:
      enabled: ${VATICA_AGENT_CONTEXT_ENABLED:true}
      output-reserve-tokens: ${VATICA_AGENT_OUTPUT_RESERVE_TOKENS:2048}
      safety-margin-tokens: ${VATICA_AGENT_CONTEXT_SAFETY_TOKENS:512}
      fallback-model-window-tokens: ${VATICA_AGENT_FALLBACK_CONTEXT_TOKENS:16000}
    # 迭代 32A/32B：先做能力硬过滤，再按词法 + Embedding 选择工具 Schema。
    # 关闭 enabled 可回退到迭代 30D 的全量注册/词法裁剪路径。
    tools:
      discovery:
        enabled: ${VATICA_AGENT_TOOL_DISCOVERY_ENABLED:true}
        max-initial-tools: ${VATICA_AGENT_TOOL_DISCOVERY_MAX_INITIAL:12}
        max-search-results: ${VATICA_AGENT_TOOL_DISCOVERY_MAX_RESULTS:8}
        max-search-expansions: ${VATICA_AGENT_TOOL_DISCOVERY_MAX_EXPANSIONS:1}
        max-initial-schema-tokens: ${VATICA_AGENT_TOOL_DISCOVERY_INITIAL_SCHEMA_TOKENS:6000}
        max-search-schema-tokens: ${VATICA_AGENT_TOOL_DISCOVERY_SEARCH_SCHEMA_TOKENS:8000}
        lexical-weight: ${VATICA_AGENT_TOOL_DISCOVERY_LEXICAL_WEIGHT:0.45}
        semantic-weight: ${VATICA_AGENT_TOOL_DISCOVERY_SEMANTIC_WEIGHT:0.55}
        minimum-score: ${VATICA_AGENT_TOOL_DISCOVERY_MINIMUM_SCORE:0.0}
  # 迭代 23B：额外开发 origin 用逗号分隔；桌面壳和默认 Vite 来源始终保留。
  cors:
    allowed-origins: ${VATICA_CORS_ALLOWED_ORIGINS:}
  # 迭代 22C：AgentScope MCP Client + 官方 MCP Java SDK Server。
  # 高德凭据由外部服务设置页解密注入；未配置 key 时跳过连接，不影响启动和本地工具。
  mcp:
    server:
      name: vatica-mcp-server
      version: 1.0.0
      instructions: Vatica 个人助理工具集：文件读写、文档生成（Word/Excel）、日历、待办、邮件、知识库检索。
    client:
      enabled: true
      request-timeout: 10s
      initialization-timeout: 10s
      retry-backoff: 300s
      connections:
        amap:
          enabled: true
          url: https://mcp.amap.com/mcp
          requires-api-key: true
          api-key: ""
  # 迭代 14：云端文件固定落在 {base-dir}/{orgId}/{userId}/，客户端只传相对路径
  workspace:
    base-dir: ./workspace
  # ===== 鉴权（迭代 13 I13-2）=====
  # enabled=false 为过渡期开关：前端登录页上线后云端部署置 true；
  # token-ttl 为 JWT 有效期，签名密钥由 .vatica/master.key 派生
  auth:
    enabled: ${VATICA_AUTH_ENABLED:false}
    token-ttl: 12h
  tool:
    # 迭代 2.5：单次请求工具调用次数上限（AgentScope 工具策略护栏），防模型死循环烧 token
    max-calls-per-request: 20
    file:
      workspace-dir: .
      max-read-size-bytes: 524288   # 512KB，防止大文件烧 token
  # ===== 邮件配置（迭代 3.5；迭代 13 改为外部服务设置页加密配置，保存后重启生效）=====
  # 未配置时 mail_query / mail_send 返回"未配置"指引，不影响其他工具
  mail:
    imap-host: ""
    imap-port: 993    # 993=IMAP SSL；其他端口按明文处理（GreenMail 测试用）
    smtp-host: ""
    smtp-port: 465    # 465=SMTP SSL；587=STARTTLS；其他端口按明文处理
    username: ""
    password: ""

# ===== 对话层配置（迭代 2.5）=====
# SSE 超时保护：上游挂起/客户端假死时主动收尾，避免连接无限期挂起（默认 5 分钟）
# 会话短期记忆（内存版）：单会话消息数滑动窗口 + 会话总数 LRU 淘汰；持久化迭代 5 已落地（JPA）
  chat:
    sse:
      timeout: 5m
    memory:
      max-messages: 20
      max-sessions: 64
      max-chars: 16000     # 单会话历史字符数上限（token 的工程近似）
      # 迭代 31B：大窗口模型按本次预算从 PostgreSQL 读取原文的硬行数上限；不是 JVM 缓存大小。
      long-context-max-messages: ${VATICA_CHAT_LONG_CONTEXT_MAX_MESSAGES:512}
    # 迭代 29A：中期摘要按批补偿；失败时只做有限次退避重试，原文仍保留在 PostgreSQL。
    summary:
      max-batch-messages: 20
      max-auto-retries: 2
      retry-initial-backoff: 5s
    # 迭代 34：Agent 推断事实的异步后置抽取；只产 AGENT_DERIVED 待确认记录，用户确认后才进上下文。
    fact:
      enabled: ${VATICA_FACT_EXTRACTION_ENABLED:true}
      max-facts-per-turn: 3
      min-assistant-chars: 120
      min-interval: 30s
  # 迭代 31C：长任务/深度审阅按需找回近期窗口之前的当前会话原文；31D 接入模式路由。
  context:
    conversation-evidence:
      enabled: ${VATICA_CONVERSATION_EVIDENCE_ENABLED:true}
      max-query-chars: 500
      max-terms: 8
      candidates-per-term: 40
      max-candidates: 200
      max-snippets: 8
      max-message-chars: 1200
      max-search-messages: ${VATICA_CONVERSATION_EVIDENCE_MAX_SEARCH_MESSAGES:5000}
  # ===== 质量评测（迭代 5.5，LLM-as-Judge）=====
  judge:
    pass-threshold: 70      # Judge 评分 >= 阈值判 PASS 交付；低分自动返工
    max-auto-rework: 2      # 低分自动返工上限（防死循环）；超限 NEEDS_REVISION 交人工
  # ===== 任务可靠性（迭代 18）=====
  task:
    # 单波次步骤的最长等待时间；超时后任务 FAILED，已完成步骤不会回滚
    step-timeout: 5m
  # ===== 固定评测发布门禁（迭代 18C）=====
  evaluation:
    min-samples-per-case: 1
    min-pass-rate: 0.8
    min-average-score: 70
    max-failed-tool-rate: 0.1
  # ===== RAG-as-a-Tool 知识库（迭代 19B）=====
  knowledge:
    enabled: ${VATICA_KNOWLEDGE_ENABLED:true}
    # local-hash 用于学习/离线闭环；生产语义召回改为 openai，配置由 EmbeddingGateway 读取。
    embedding-provider: ${VATICA_KNOWLEDGE_EMBEDDING_PROVIDER:local-hash}
    openai:
      base-url: ${VATICA_KNOWLEDGE_EMBEDDING_BASE_URL:}
      api-key: ${VATICA_KNOWLEDGE_EMBEDDING_API_KEY:}
      model: ${VATICA_KNOWLEDGE_EMBEDDING_MODEL:}
    vector-dimensions: ${VATICA_KNOWLEDGE_VECTOR_DIMENSIONS:1536}
    max-document-bytes: 5242880
    chunk-size: 800
    chunk-overlap: 120
    max-search-chars: 6000
  # ===== 模型选择器（迭代 7 I7-5）=====
  # 主模型 DeepSeek 走 vatica.model.openai.*；备用模型通义千问（OpenAI 兼容）：
  #   setx QWEN_API_KEY <你的通义Key> 后重启，前端模型选择器即可切换
  model:
    openai:
      api-key: ""
      base-url: https://api.deepseek.com
      chat:
        model: deepseek-v4-flash
        temperature: 0.7
    qwen:
      # 迭代 13：不再读环境变量；key 走凭据库/请求级透传
      api-key: ""
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      model: qwen-plus
      temperature: 0.7

# 调试工具调用轮次（需要时取消注释，默认关闭）
# logging:
#   level:
#     com.example.vatica.agentscope: DEBUG

# ===== OpenAPI 契约（迭代 9 I9-2，springdoc）=====
# /v3/api-docs = 前后端契约单一事实来源；/swagger-ui.html = 开发期可视化契约
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8080
