spring:
  application:
    name: vatica
  # ═══ 迭代 19A：PostgreSQL 持久化（任务 + 会话 + pgvector 基础）═══
  # 凭据走环境变量（仿 DEEPSEEK_API_KEY 模式），默认指向本机 PostgreSQL：
  #   setx POSTGRES_USERNAME vatica / setx POSTGRES_PASSWORD <密码>
  # 云 PostgreSQL：setx POSTGRES_HOST <主机> + setx POSTGRES_PASSWORD <密码>
  # 注意：云库凭据不要写进 yml/提交 git（仓库公开）
  # 测试环境用 H2（兼容模式，见测试类 properties）
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DATABASE:vatica}
    username: ${POSTGRES_USERNAME:vatica}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update      # 开发期自动建表；生产应改 validate + 迁移脚本
    open-in-view: false

# ===== 工具层配置（迭代 2；迭代 11 改为 Codex workspace 语义）=====
# workspace-dir = 默认工作区根（相对路径以进程工作目录为基准，即 Codex 的启动目录）
# 内部状态（日历/待办/模型配置/H2 打包库）在 vatica.app.state-dir，取代旧 ./data
vatica:
  app:
    state-dir: ./.vatica
  # 迭代 21D：Agent Span 明细默认保留 30 天；启动时 best-effort 清理过期记录。
  observability:
    retention: ${VATICA_OBSERVABILITY_RETENTION:30d}
  # 迭代 22C：AgentScope MCP Client + 官方 MCP Java SDK Server。
  # 高德凭据由外部服务设置页解密注入；未配置 key 时跳过连接，不影响启动和本地工具。
  mcp:
    server:
      name: vatica-mcp-server
      version: 1.0.0
      instructions: Vatica 个人助理工具集：文件读写、文档生成（Word/Excel）、日历、待办、邮件、知识库检索。
    client:
      enabled: true
      request-timeout: 10s
      initialization-timeout: 10s
      retry-backoff: 300s
      connections:
        amap:
          enabled: true
          url: https://mcp.amap.com/mcp
          requires-api-key: true
          api-key: ""
  # 迭代 14：云端文件固定落在 {base-dir}/{orgId}/{userId}/，客户端只传相对路径
  workspace:
    base-dir: ./workspace
  # ===== 鉴权（迭代 13 I13-2）=====
  # enabled=false 为过渡期开关：前端登录页上线后云端部署置 true；
  # token-ttl 为 JWT 有效期，签名密钥由 .vatica/master.key 派生
  auth:
    enabled: false
    token-ttl: 12h
  tool:
    # 迭代 2.5：单次请求工具调用次数上限（AgentScope 工具策略护栏），防模型死循环烧 token
    max-calls-per-request: 20
    file:
      workspace-dir: .
      max-read-size-bytes: 524288   # 512KB，防止大文件烧 token
  # ===== 邮件配置（迭代 3.5；迭代 13 改为外部服务设置页加密配置，保存后重启生效）=====
  # 未配置时 mail_query / mail_send 返回"未配置"指引，不影响其他工具
  mail:
    imap-host: ""
    imap-port: 993    # 993=IMAP SSL；其他端口按明文处理（GreenMail 测试用）
    smtp-host: ""
    smtp-port: 465    # 465=SMTP SSL；587=STARTTLS；其他端口按明文处理
    username: ""
    password: ""

# ===== 对话层配置（迭代 2.5）=====
# SSE 超时保护：上游挂起/客户端假死时主动收尾，避免连接无限期挂起（默认 5 分钟）
# 会话短期记忆（内存版）：单会话消息数滑动窗口 + 会话总数 LRU 淘汰；持久化迭代 5 已落地（JPA）
  chat:
    sse:
      timeout: 5m
    memory:
      max-messages: 20
      max-sessions: 64
      max-chars: 16000     # 单会话历史字符数上限（token 的工程近似）
  # ===== 质量评测（迭代 5.5，LLM-as-Judge）=====
  judge:
    pass-threshold: 70      # Judge 评分 >= 阈值判 PASS 交付；低分自动返工
    max-auto-rework: 2      # 低分自动返工上限（防死循环）；超限 NEEDS_REVISION 交人工
  # ===== 任务可靠性（迭代 18）=====
  task:
    # 单波次步骤的最长等待时间；超时后任务 FAILED，已完成步骤不会回滚
    step-timeout: 5m
  # ===== 固定评测发布门禁（迭代 18C）=====
  evaluation:
    min-samples-per-case: 1
    min-pass-rate: 0.8
    min-average-score: 70
    max-failed-tool-rate: 0.1
  # ===== RAG-as-a-Tool 知识库（迭代 19B）=====
  knowledge:
    enabled: ${VATICA_KNOWLEDGE_ENABLED:true}
    # local-hash 用于学习/离线闭环；生产语义召回改为 openai，配置由 EmbeddingGateway 读取。
    embedding-provider: ${VATICA_KNOWLEDGE_EMBEDDING_PROVIDER:local-hash}
    openai:
      base-url: ${VATICA_KNOWLEDGE_EMBEDDING_BASE_URL:}
      api-key: ${VATICA_KNOWLEDGE_EMBEDDING_API_KEY:}
      model: ${VATICA_KNOWLEDGE_EMBEDDING_MODEL:}
    vector-dimensions: ${VATICA_KNOWLEDGE_VECTOR_DIMENSIONS:1536}
    max-document-bytes: 5242880
    chunk-size: 800
    chunk-overlap: 120
    max-search-chars: 6000
  # ===== 模型选择器（迭代 7 I7-5）=====
  # 主模型 DeepSeek 走 vatica.model.openai.*；备用模型通义千问（OpenAI 兼容）：
  #   setx QWEN_API_KEY <你的通义Key> 后重启，前端模型选择器即可切换
  model:
    openai:
      api-key: ""
      base-url: https://api.deepseek.com
      chat:
        model: deepseek-v4-flash
        temperature: 0.7
    qwen:
      # 迭代 13：不再读环境变量；key 走凭据库/请求级透传
      api-key: ""
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      model: qwen-plus
      temperature: 0.7

# 调试工具调用轮次（需要时取消注释，默认关闭）
# logging:
#   level:
#     com.example.vatica.agentscope: DEBUG

# ===== OpenAPI 契约（迭代 9 I9-2，springdoc）=====
# /v3/api-docs = 前后端契约单一事实来源；/swagger-ui.html = 开发期可视化契约
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8080
