<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Office Agent · 对话验证页</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", system-ui, sans-serif;
    height: 100vh; display: flex; flex-direction: column;
    background: #f5f6f8; color: #1f2329;
  }
  header {
    padding: 12px 20px; background: #fff; border-bottom: 1px solid #e5e6eb;
    font-weight: 600; font-size: 15px;
  }
  header span { color: #8f959e; font-weight: 400; font-size: 12px; margin-left: 8px; }
  #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .msg {
    max-width: 70%; padding: 10px 14px; border-radius: 10px;
    line-height: 1.6; white-space: pre-wrap; word-break: break-word; font-size: 14px;
  }
  .msg.user { align-self: flex-end; background: #3370ff; color: #fff; }
  .msg.bot  { align-self: flex-start; background: #fff; border: 1px solid #e5e6eb; }
  .msg.bot.typing::after { content: "▌"; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #inputbar { display: flex; gap: 10px; padding: 12px 20px; background: #fff; border-top: 1px solid #e5e6eb; }
  #msg {
    flex: 1; resize: none; height: 44px; padding: 10px 12px; font-size: 14px;
    border: 1px solid #dcdfe6; border-radius: 8px; outline: none;
  }
  #msg:focus { border-color: #3370ff; }
  button {
    width: 88px; border: none; border-radius: 8px; background: #3370ff;
    color: #fff; font-size: 14px; cursor: pointer;
  }
  button:disabled { background: #a0b8f5; cursor: not-allowed; }
</style>
</head>
<body>
<header>Office Agent<span>第 1 周验证页 · SSE 流式打字机</span></header>
<div id="chat">
  <div class="msg bot">你好，我是你的 AI 办公助理。试试让我写一段周报吧。</div>
</div>
<div id="inputbar">
  <textarea id="msg" placeholder="输入你的问题，Enter 发送 / Shift+Enter 换行"></textarea>
  <button id="send">发送</button>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('msg');
const sendBtn = document.getElementById('send');

sendBtn.addEventListener('click', send);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

function appendMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

async function send() {
  const text = input.value.trim();
  if (!text || sendBtn.disabled) return;
  input.value = '';
  appendMsg('user', text);
  const botEl = appendMsg('bot', '');
  botEl.classList.add('typing');
  sendBtn.disabled = true;

  try {
    const res = await fetch('/api/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text }),
    });
    if (!res.ok || !res.body) throw new Error('HTTP ' + res.status);

    const reader = res.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buffer = '';          // SSE 事件缓冲
    let streamEnded = false;

    while (!streamEnded) {
      const { value, done } = await reader.read();
      streamEnded = done;
      if (value) buffer += decoder.decode(value, { stream: true });

      // 按 SSE 事件边界（空行）切分，提取 data: 载荷
      let idx;
      while ((idx = buffer.indexOf('\n\n')) >= 0) {
        const event = buffer.slice(0, idx);
        buffer = buffer.slice(idx + 2);
        for (const line of event.split('\n')) {
          if (line.startsWith('data:')) {
            const payload = line.slice(5).replace(/^ /, '');
            if (payload) {
              botEl.textContent += payload;
              chat.scrollTop = chat.scrollHeight;
            }
          }
        }
      }
    }
    // 尾部残余事件
    if (buffer.trim()) {
      for (const line of buffer.split('\n')) {
        if (line.startsWith('data:')) botEl.textContent += line.slice(5).replace(/^ /, '');
      }
    }
  } catch (err) {
    botEl.textContent = '出错了：' + err.message;
  } finally {
    botEl.classList.remove('typing');
    sendBtn.disabled = false;
  }
}
</script>
</body>
</html>
